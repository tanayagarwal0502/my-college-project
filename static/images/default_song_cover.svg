<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f" />
      <stop offset="50%" stop-color="#2a2550" />
      <stop offset="100%" stop-color="#111119" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="discShine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="20" fill="url(#coverGrad)" />

  <!-- Outer Vinyl Groove Ring -->
  <circle cx="250" cy="230" r="160" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3" />
  <circle cx="250" cy="230" r="130" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <circle cx="250" cy="230" r="100" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2" />

  <!-- Center Artwork Glow -->
  <circle cx="250" cy="230" r="70" fill="url(#accentGrad)" opacity="0.85" />
  <circle cx="250" cy="230" r="70" fill="url(#discShine)" />

  <!-- Central Musical Note Icon -->
  <path d="M265 190 v55 a22 22 0 1 1 -15 -21 v-42 l40 -10 v25 z" 
        fill="#ffffff" 
        filter="drop-shadow(0 4px 12px rgba(0,0,0,0.35))" />

  <!-- Audio Waveform Decorative Bars -->
  <g fill="url(#accentGrad)" opacity="0.75">
    <rect x="180" y="380" width="8" height="24" rx="4" />
    <rect x="196" y="365" width="8" height="39" rx="4" />
    <rect x="212" y="355" width="8" height="49" rx="4" />
    <rect x="228" y="340" width="8" height="64" rx="4" />
    <rect x="244" y="330" width="8" height="74" rx="4" />
    <rect x="260" y="345" width="8" height="59" rx="4" />
    <rect x="276" y="360" width="8" height="44" rx="4" />
    <rect x="292" y="370" width="8" height="34" rx="4" />
    <rect x="308" y="380" width="8" height="24" rx="4" />
  </g>

  <!-- Clean Subtitle -->
  <text x="250" y="445" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="14" 
        font-weight="600" 
        letter-spacing="2.5" 
        fill="#94a3b8" 
        opacity="0.85">AUDIO TRACK</text>
</svg>
